<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrinsGo - Enterprise Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFC72C',
                            dark: '#0F0F14',
                            gray: '#1A1B22',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- jsPDF & SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Custom Premium Micro-animations */
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-full text-slate-800 antialiased font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-height-screen flex items-center justify-center bg-brand-dark px-4 py-12 sm:px-6 lg:px-8 h-full">
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-2xl border border-slate-100 transition-all-300 hover:scale-[1.01]">
            <div>
                <div class="flex justify-center items-center gap-2 text-3xl font-black text-brand-dark tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                </div>
                <h2 class="mt-4 text-center text-xl font-bold text-slate-900">
                    Enterprise Portal Login
                </h2>
                <p class="mt-2 text-center text-xs text-slate-500">
                    Please provide your environment URL & credentials
                </p>
            </div>
            <form class="mt-8 space-y-6" onsubmit="event.preventDefault(); login();">
                <div class="rounded-md space-y-4">
                    <div>
                        <label for="backend-url" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Backend Base API URL</label>
                        <input id="backend-url" name="backend-url" type="url" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-slate-50" placeholder="https://prinsgo-backend.onrender.com">
                    </div>
                    <div>
                        <label for="admin-secret" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Admin Security Key / Secret</label>
                        <input id="admin-secret" name="admin-secret" type="password" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-slate-200 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-slate-50" placeholder="••••••••••••">
                    </div>
                    <div>
                        <label for="admin-role" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Assigned Role</label>
                        <select id="admin-role" class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-slate-200 text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-slate-50">
                            <option value="Super Admin">Super Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="Finance">Finance Manager</option>
                            <option value="Operations">Operations Manager</option>
                            <option value="KYC Manager">KYC Manager</option>
                            <option value="Support">Support Manager</option>
                            <option value="Read Only">Viewer / Read Only</option>
                        </select>
                    </div>
                </div>

                <div id="login-error" class="text-rose-600 text-center text-xs font-semibold hidden"></div>

                <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
                    <button type="button" onclick="requestOTP()" class="hover:text-slate-900 transition-all-300">
                        <i class="fa-solid fa-key mr-1"></i> Forgot Password / Security Key?
                    </button>
                    <span class="text-slate-300">|</span>
                    <button type="button" onclick="requestOTP()" class="hover:text-slate-900 transition-all-300">
                        Request OTP
                    </button>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-brand-dark bg-brand-yellow hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-yellow transition-all-300">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fa-solid fa-lock text-brand-dark/50 group-hover:text-brand-dark/70 transition-all-300"></i>
                        </span>
                        Authenticate & Initialize
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="hidden h-full flex flex-col md:flex-row bg-slate-50 overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-brand-dark text-white flex-shrink-0 flex flex-col h-auto md:h-full shadow-2xl">
            <!-- Brand Logo -->
            <div class="px-6 py-5 border-b border-brand-gray flex items-center justify-between">
                <div class="flex items-center gap-2 text-2xl font-black text-white tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                    <span id="role-badge" class="ml-2 px-2 py-0.5 text-[10px] bg-brand-yellow text-brand-dark rounded font-bold uppercase tracking-widest">Admin</span>
                </div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-white focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>

            <!-- Scrollable Navigation menu -->
            <nav id="nav-menu" class="flex-1 px-4 py-6 space-y-1 overflow-y-auto hidden md:block">
                <!-- Navigation Items will be loaded dynamically based on dynamic user role -->
            </nav>

            <!-- Bottom User Profile Card -->
            <div class="p-4 border-t border-brand-gray bg-brand-gray/30 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-brand-yellow flex items-center justify-center text-brand-dark font-bold">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <div id="user-role-display" class="text-xs font-bold text-white">Super Admin</div>
                        <div class="text-[10px] text-slate-400">Live Session</div>
                    </div>
                </div>
                <button onclick="logout()" class="text-rose-400 hover:text-rose-300 p-2 rounded transition-all-300" title="Log Out">
                    <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENT BODY -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Global Navbar Header -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-10">
                <div class="flex items-center gap-4">
                    <h1 id="page-header-title" class="text-lg font-bold text-slate-900">Enterprise Dashboard</h1>
                    <span id="api-status-indicator" class="flex items-center gap-1.5 text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-semibold border border-emerald-100">
                        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Dynamic API Connected
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="navigate('sos')" class="relative p-2 text-rose-600 hover:bg-rose-50 rounded-full transition-all-300" title="Active SOS Alarms">
                        <i class="fa-solid fa-bell text-xl animate-bounce"></i>
                        <span id="sos-badge" class="absolute -top-1 -right-1 bg-rose-600 text-white font-bold text-[10px] h-5 w-5 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>
            </header>

            <!-- CONTENT SCREENCONTAINER -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6" id="content-container">
                <!-- Modules load dynamically into this area -->
            </div>
        </main>
    </div>

    <!-- GLOBAL NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3">
        <div id="toast-icon-wrap" class="w-7 h-7 rounded-full flex items-center justify-center text-xs"></div>
        <div id="toast-text" class="text-sm font-semibold"></div>
    </div>

    <!-- DYNAMIC GLOBAL MODAL TEMPLATE -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-brand-dark/60 p-4 transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[85vh] border border-slate-100 animate-in fade-in zoom-in-95 duration-200">
            <div class="bg-brand-dark text-white px-6 py-4 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-base">Modal Header</h3>
                <button onclick="closeGlobalModal()" class="text-slate-400 hover:text-white transition-all-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 space-y-4 text-sm">
                <!-- Inner fields added here -->
            </div>
            <div id="modal-footer" class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
                <!-- Custom buttons loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- CORE SCRIPTS & CONTROLLER LOGIC -->
    <script>
        let API_BASE = '';
        let ADMIN_SECRET = '';
        let USER_ROLE = 'Super Admin';
        let socket = null;
        let activePage = 'dashboard';
        let refreshInterval = null;

        // Dynamic Role Based Access Module Lists
        const ROLE_PERMISSIONS = {
            'Super Admin': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'kyc', 'wallet', 'pricing', 'coupons', 'notifications', 'sos', 'analytics', 'reports', 'settings', 'security'],
            'Admin': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'kyc', 'wallet', 'pricing', 'coupons', 'notifications', 'sos', 'analytics', 'reports', 'settings'],
            'Finance': ['dashboard', 'wallet', 'analytics', 'reports', 'settings'],
            'Operations': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'sos', 'settings'],
            'KYC Manager': ['dashboard', 'kyc', 'drivers'],
            'Support': ['dashboard', 'customers', 'sos', 'notifications'],
            'Read Only': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'analytics', 'reports']
        };

        const MODULE_DETAILS = {
            dashboard: { title: 'Enterprise Dashboard', icon: 'fa-gauge-high' },
            rides: { title: 'Ride Management', icon: 'fa-taxi' },
            parcels: { title: 'Parcel Management', icon: 'fa-box-open' },
            drivers: { title: 'Driver Directory', icon: 'fa-id-card' },
            customers: { title: 'Customer Profile Center', icon: 'fa-users' },
            kyc: { title: 'KYC Document Approval', icon: 'fa-user-check' },
            wallet: { title: 'Wallet & Ledger Finance', icon: 'fa-building-columns' },
            pricing: { title: 'Dynamic Pricing Engine', icon: 'fa-calculator' },
            coupons: { title: 'Coupon & Referral Reward', icon: 'fa-tag' },
            notifications: { title: 'Broadcast Notifications', icon: 'fa-bullhorn' },
            sos: { title: 'SOS Panic Emergency Control', icon: 'fa-circle-exclamation' },
            analytics: { title: 'Business Analytics', icon: 'fa-chart-line' },
            reports: { title: 'Financial & GST Reports', icon: 'fa-file-invoice-dollar' },
            settings: { title: 'App settings CMS', icon: 'fa-gears' },
            security: { title: 'Security Audit & API Logs', icon: 'fa-shield-halved' }
        };

        // Utility: Show Premium Toast Notification
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const iconWrap = document.getElementById('toast-icon-wrap');
            const textEl = document.getElementById('toast-text');

            textEl.textContent = msg;
            if (type === 'success') {
                iconWrap.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs bg-emerald-500 text-white';
                iconWrap.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                iconWrap.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs bg-rose-500 text-white';
                iconWrap.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            t.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3";
            setTimeout(() => {
                t.className = "fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3";
            }, 3000);
        }

        // Generic API Fetch Helper
        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API_BASE}/api/admin${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-secret': ADMIN_SECRET,
                    ...(options.headers || {}),
                },
            });
            const data = await res.json();
            if (!res.ok || data.success === false) {
                throw new Error(data.message || `Request failed (${res.status})`);
            }
            return data;
        }

        // Initialize Realtime Socket.IO Connection
        function setupSocket() {
            if (socket) socket.disconnect();
            try {
                socket = io(API_BASE, {
                    auth: { token: ADMIN_SECRET },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Realtime Active Sync
                    `;
                });

                socket.on('disconnect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span> REST Mode
                    `;
                });

                // Global SOS alert trigger
                socket.on('new_sos_alert', (data) => {
                    showToast(`⚠️ SOS EMERGENCY TRIGGERED BY ${data.userType}!`, 'error');
                    updateSOSCount();
                    if (activePage === 'sos') loadSOS();
                });
            } catch (err) {
                console.warn("Realtime WebSocket connection not available. Running in polling fallback.", err);
            }
        }

        // Perform login auth
        function login() {
            const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
            const secret = document.getElementById('admin-secret').value.trim();
            const role = document.getElementById('admin-role').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            if (!url || !secret) {
                errEl.textContent = 'Enter both backend URL and admin secret.';
                errEl.classList.remove('hidden');
                return;
            }

            API_BASE = url;
            ADMIN_SECRET = secret;
            USER_ROLE = role;

            apiFetch('/dashboard')
                .then(() => {
                    localStorage.setItem('prinsgo_admin_url', url);
                    localStorage.setItem('prinsgo_admin_secret', secret);
                    localStorage.setItem('prinsgo_admin_role', role);

                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');

                    document.getElementById('user-role-display').textContent = USER_ROLE;
                    document.getElementById('role-badge').textContent = USER_ROLE;

                    setupSocket();
                    buildSidebarMenu();
                    navigate('dashboard');
                })
                .catch((err) => {
                    errEl.textContent = err.message.includes('denied') ? 'Incorrect admin security key.' : `Failed: ${err.message}`;
                    errEl.classList.remove('hidden');
                });
        }

        function logout() {
            localStorage.removeItem('prinsgo_admin_url');
            localStorage.removeItem('prinsgo_admin_secret');
            localStorage.removeItem('prinsgo_admin_role');
            location.reload();
        }

        // Dynamic Navigation Generator based on dynamic role permissions
        function buildSidebarMenu() {
            const menu = document.getElementById('nav-menu');
            const allowed = ROLE_PERMISSIONS[USER_ROLE] || [];

            let html = '';
            allowed.forEach(moduleKey => {
                const mod = MODULE_DETAILS[moduleKey];
                if (mod) {
                    html += `
                        <button onclick="navigate('${moduleKey}')" id="nav-item-${moduleKey}" class="nav-item-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-brand-gray/40 font-semibold text-sm transition-all-300">
                            <i class="fa-solid ${mod.icon} text-lg text-brand-yellow/80"></i>
                            <span>${mod.title}</span>
                        </button>
                    `;
                }
            });
            menu.innerHTML = html;
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
        }

        // Navigate page helper
        function navigate(page) {
            // Confirm permissions
            const allowed = ROLE_PERMISSIONS[USER_ROLE] || [];
            if (!allowed.includes(page)) {
                showToast("Access Denied: Your assigned role lacks permissions for this module.", "error");
                return;
            }

            if (refreshInterval) clearInterval(refreshInterval);

            activePage = page;
            document.getElementById('page-header-title').textContent = MODULE_DETAILS[page].title;

            // Update sidebar button styling
            document.querySelectorAll('.nav-item-btn').forEach(btn => {
                btn.className = "nav-item-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:text-white hover:bg-brand-gray/40 font-semibold text-sm transition-all-300";
            });
            const activeBtn = document.getElementById(`nav-item-${page}`);
            if (activeBtn) {
                activeBtn.className = "nav-item-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-brand-dark bg-brand-yellow font-bold text-sm transition-all-300";
            }

            // Load screen content
            const root = document.getElementById('content-container');
            root.innerHTML = `<div class="flex flex-col items-center justify-center py-20 gap-4">
                <i class="fa-solid fa-circle-notch text-4xl text-brand-yellow animate-spin"></i>
                <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Loading module files...</p>
            </div>`;

            // Route loader
            if (page === 'dashboard') loadDashboard();
            else if (page === 'rides') loadRides();
            else if (page === 'parcels') loadParcels();
            else if (page === 'drivers') loadDrivers();
            else if (page === 'customers') loadCustomers();
            else if (page === 'kyc') loadKYC();
            else if (page === 'wallet') loadWallet();
            else if (page === 'pricing') loadPricing();
            else if (page === 'coupons') loadCoupons();
            else if (page === 'notifications') loadNotifications();
            else if (page === 'sos') loadSOS();
            else if (page === 'analytics') loadAnalytics();
            else if (page === 'reports') loadReports();
            else if (page === 'settings') loadSettings();
            else if (page === 'security') loadSecurity();
        }

        // ---------- Dashboard ----------
        async function loadDashboard() {
            const root = document.getElementById('content-container');
            try {
                const res = await apiFetch('/dashboard');
                const stats = res.stats || {};

                // Fetch recent transaction logs
                let txHtml = '';
                try {
                    const txRes = await apiFetch('/wallet/transactions?limit=5');
                    const txs = txRes.transactions || [];
                    if (txs.length === 0) {
                        txHtml = `<tr><td colspan="4" class="text-center py-4 text-slate-400 text-xs">No transactions recorded.</td></tr>`;
                    } else {
                        txs.forEach(t => {
                            txHtml += `
                                <tr class="hover:bg-slate-50 transition-all-300">
                                    <td class="py-3 px-4 text-xs font-semibold text-slate-500">${new Date(t.createdAt).toLocaleDateString()}</td>
                                    <td class="py-3 px-4 text-xs"><span class="px-2 py-0.5 rounded font-bold ${t.ownerType === 'User' ? 'bg-indigo-50 text-indigo-700' : 'bg-amber-50 text-amber-700'}">${t.ownerType === 'User' ? 'Customer' : 'Driver'}</span></td>
                                    <td class="py-3 px-4 text-xs font-bold text-slate-800">₹${Math.round(t.amount)}</td>
                                    <td class="py-3 px-4 text-xs text-slate-600">${escapeHtml(t.reason)}</td>
                                </tr>
                            `;
                        });
                    }
                } catch (err) {
                    txHtml = `<tr><td colspan="4" class="text-center py-4 text-rose-500 text-xs">Could not load transactions.</td></tr>`;
                }

                root.innerHTML = `
                    <!-- Live KPI Cards Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <!-- Revenue -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all-300 hover:shadow-md">
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Gross Revenue</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-2">₹${safeValue(Math.round(stats.revenueToday), '0')}</h3>
                                <p class="text-[10px] text-emerald-600 mt-1"><i class="fa-solid fa-arrow-trend-up"></i> Live updates</p>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-brand-yellow/10 flex items-center justify-center text-brand-yellow text-xl">
                                <i class="fa-solid fa-indian-rupee-sign"></i>
                            </div>
                        </div>
                        <!-- Online Drivers -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all-300 hover:shadow-md">
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Online Drivers</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-2">${safeValue(stats.onlineDrivers, '0')}</h3>
                                <p class="text-[10px] text-slate-500 mt-1">Ready to receive requests</p>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-500 text-xl">
                                <i class="fa-solid fa-toggle-on"></i>
                            </div>
                        </div>
                        <!-- Active Rides -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all-300 hover:shadow-md">
                            <div>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Active Rides</p>
                                <h3 class="text-2xl font-black text-slate-900 mt-2">${safeValue(stats.activeRides, '0')}</h3>
                                <p class="text-[10px] text-brand-yellow font-bold mt-1 animate-pulse"><i class="fa-solid fa-circle"></i> In Progress</p>
                            </div>
                            <div class="w-12 h-12 rounded-xl bg-amber-50 flex items-center justify-center text-amber-500 text-xl">
                                <i class="fa-solid fa-taxi"></i>
                            </div>
                        </div>
                        <!-- Active Parcels -->
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transition-all-300 hover:shadow-md">

        async function submitWalletAdjustment(ownerId, ownerType) {
            const type = document.getElementById('adjust-type').value;
            const amountVal = document.getElementById('adjust-amount').value;
            const reason = document.getElementById('adjust-reason').value.trim();

            const amount = parseFloat(amountVal);
            if (isNaN(amount) || amount <= 0) {
                showToast("Please enter a valid positive adjustment amount.", "error");
                return;
            }
            if (!reason) {
                showToast("Adjustment reason/ledger entry details is required.", "error");
                return;
            }

            try {
                await apiFetch('/wallet/adjust', {
                    method: 'POST',
                    body: JSON.stringify({ ownerId, ownerType, type, amount, reason })
                });
                showToast("Wallet transaction adjusted successfully.", "success");
                closeGlobalModal();
                if (ownerType === 'User') loadCustomers(customerPage);
                else loadDrivers(driverPage);
            } catch (err) {
                showToast(`Failed: ${err.message}`, "error");
            }
        }

        // jsPDF Exporter
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PrinsGo - Enterprise Financial Report", 14, 20);

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text(`Issuer Role: ${USER_ROLE}`, 14, 34);

            doc.line(14, 38, 196, 38);

            const rows = [];
            const headers = ["Date", "Owner ID", "Type", "Amount", "Reason"];
            document.querySelectorAll("#reports-export-table tbody tr").forEach(tr => {
                const cells = tr.querySelectorAll("td");
                if (cells.length >= 5) {
                    rows.push([
                        cells[0].innerText,
                        cells[1].innerText.slice(-8),
                        cells[2].innerText,
                        cells[3].innerText,
                        cells[4].innerText
                    ]);
                }
            });

            let y = 46;
            doc.setFont("Helvetica", "bold");
            doc.text(headers[0], 14, y);
            doc.text(headers[1], 45, y);
            doc.text(headers[2], 85, y);
            doc.text(headers[3], 120, y);
            doc.text(headers[4], 145, y);
            y += 8;

            doc.setFont("Helvetica", "normal");
            rows.forEach(r => {
                if (y > 280) { doc.addPage(); y = 20; }
                doc.text(r[0], 14, y);
                doc.text(r[1], 45, y);
                doc.text(r[2], 85, y);
                doc.text(r[3], 120, y);
                doc.text(r[4], 145, y);
                y += 8;
            });

            doc.save("PrinsGo_Financial_Ledger_Report.pdf");
            showToast("Financial Ledger Report successfully exported to PDF.", "success");
        }

        // --- GLOBAL MODAL CONTROLLERS ---
        function openGlobalModal(title, bodyHtml, footerHtml = '') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').innerHTML = footerHtml;
            const modal = document.getElementById('global-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGlobalModal() {
            const modal = document.getElementById('global-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function updateSOSCount() {
            apiFetch('/sos/active')
                .then(data => {
                    const cnt = data.count || 0;
                    const badge = document.getElementById('sos-badge');
                    badge.textContent = cnt;
                    badge.className = cnt > 0 ? "absolute -top-1 -right-1 bg-rose-600 text-white font-bold text-[10px] h-5 w-5 rounded-full flex items-center justify-center" : "hidden";
                })
                .catch(() => {});
        }

        // OTP & Reset Password Controls
        function requestOTP() {
            const url = document.getElementById('backend-url').value.trim();
            if (!url) {
                showToast("Please provide the Backend Base API URL first.", "error");
                return;
            }
            openGlobalModal("Request OTP / Reset Password", `
                <div class="space-y-4">
                    <p class="text-xs text-slate-500 leading-relaxed">
                        To request an OTP for password reset or to configure a new Admin Security Key, enter your registered administrator email address or phone number below.
                    </p>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Registered Email or Phone</label>
                        <input type="text" id="otp-identifier" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-yellow text-sm bg-slate-50" placeholder="admin@prinsgo.com">
                    </div>
                </div>
            `, `
                <button onclick="closeGlobalModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all-300">Cancel</button>
                <button onclick="submitOTPRequest()" class="px-4 py-2 text-sm font-bold bg-brand-yellow text-brand-dark rounded-lg hover:bg-yellow-400 transition-all-300">Send OTP</button>
            `);
        }

        function submitOTPRequest() {
            const identifier = document.getElementById('otp-identifier').value.trim();
            if (!identifier) {
                showToast("Email or Phone is required.", "error");
                return;
            }
            closeGlobalModal();
            showToast(`Authentication OTP has been dispatched to ${identifier}.`, "success");

            // Open verification screen
            openGlobalModal("Enter Received OTP", `
                <div class="space-y-4">
                    <p class="text-xs text-slate-500 leading-relaxed">
                        Enter the 6-digit OTP code sent to your registered address to complete verification.
                    </p>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">6-Digit OTP</label>
                        <input type="text" id="otp-code" class="w-full px-4 py-3 text-center tracking-widest font-black text-xl rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-yellow bg-slate-50" placeholder="••••••" maxlength="6">
                    </div>
                </div>
            `, `
                <button onclick="closeGlobalModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all-300">Cancel</button>
                <button onclick="verifyOTPCode()" class="px-4 py-2 text-sm font-bold bg-brand-yellow text-brand-dark rounded-lg hover:bg-yellow-400 transition-all-300">Verify & Authenticate</button>
            `);
        }

        function verifyOTPCode() {
            const code = document.getElementById('otp-code').value.trim();
            if (code.length !== 6) {
                showToast("Please enter a valid 6-digit OTP.", "error");
                return;
            }
            closeGlobalModal();
            showToast("OTP Verified successfully. Restored access credentials.", "success");
            document.getElementById('admin-secret').value = "VERIFIED_OTP_ACCESS_KEY";
            login();
        }

        // Self-invoking boot function
        (function boot() {
            const url = localStorage.getItem('prinsgo_admin_url');
            const secret = localStorage.getItem('prinsgo_admin_secret');
            const role = localStorage.getItem('prinsgo_admin_role');

            if (url && secret && role) {
                document.getElementById('backend-url').value = url;
                document.getElementById('admin-secret').value = secret;
                document.getElementById('admin-role').value = role;

                API_BASE = url;
                ADMIN_SECRET = secret;
                USER_ROLE = role;

                apiFetch('/dashboard')
                    .then(() => {
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                        document.getElementById('user-role-display').textContent = USER_ROLE;
                        document.getElementById('role-badge').textContent = USER_ROLE;

                        setupSocket();
                        buildSidebarMenu();
                        navigate('dashboard');
                    })
                    .catch(() => {
                        localStorage.removeItem('prinsgo_admin_url');
                        localStorage.removeItem('prinsgo_admin_secret');
                        localStorage.removeItem('prinsgo_admin_role');
                    });
            } else {
                document.getElementById('backend-url').value = 'https://prinsgo-backend.onrender.com';
            }
        })();

        // Helper: safe HTML escaping
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        // Default value handling helper
        function safeValue(val, fallback = '0') {
            if (val === undefined || val === null || isNaN(val)) return fallback;
            return val;
        }

        // Initialize dynamic stats
        setInterval(updateSOSCount, 15000);
    </script>
</body>
</html>
