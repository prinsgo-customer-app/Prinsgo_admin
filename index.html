<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrinsGo - Enterprise Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFC72C',
                            dark: '#0F0F14',
                            gray: '#1A1B22',
                            bg: '#0B0B0F',
                            card: '#16161F'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- jsPDF & SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0B0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFC72C40;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFC72C70;
        }
        /* Custom Premium Micro-animations */
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Subtle Page Slide-over Transition */
        .animate-slide-over {
            animation: slideOver 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideOver {
            from {
                opacity: 0;
                transform: translateX(10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Interactive Bell Shake Animation */
        .animate-bell-shake {
            animation: bellShake 0.6s ease-in-out;
        }

        @keyframes bellShake {
            0%, 100% { transform: rotate(0); }
            20%, 60% { transform: rotate(15deg); }
            40%, 80% { transform: rotate(-15deg); }
        }

        /* Reduced Motion Accessibility Overrides */
        @media (prefers-reduced-motion: reduce) {
            .animate-slide-over, .animate-bell-shake, .animate-pulse {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="h-full text-slate-100 antialiased font-sans bg-brand-bg selection:bg-brand-yellow/30">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-height-screen flex items-center justify-center bg-brand-bg px-4 py-12 sm:px-6 lg:px-8 h-full">
        <div class="max-w-md w-full space-y-8 bg-brand-card p-10 rounded-2xl shadow-2xl border border-brand-gray transition-all-300 hover:scale-[1.01]">
            <div>
                <div class="flex justify-center items-center gap-2 text-3xl font-black text-white tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                </div>
                <h2 class="mt-4 text-center text-xl font-bold text-white">
                    Enterprise Portal Login
                </h2>
                <p class="mt-2 text-center text-xs text-slate-400">
                    Please provide your environment URL & credentials
                </p>
            </div>
            <form class="mt-8 space-y-6" onsubmit="event.preventDefault(); login();">
                <div class="rounded-md space-y-4">
                    <div>
                        <label for="backend-url" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Backend Base API URL</label>
                        <input id="backend-url" name="backend-url" type="url" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray placeholder-slate-500 text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark" placeholder="https://prinsgo-backend.onrender.com">
                    </div>
                    <div>
                        <label for="admin-secret" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Admin Security Key / Secret</label>
                        <input id="admin-secret" name="admin-secret" type="password" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray placeholder-slate-500 text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark" placeholder="••••••••••••">
                    </div>
                    <div>
                        <label for="admin-role" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Assigned Role</label>
                        <select id="admin-role" class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark">
                            <option value="Super Admin">Super Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="Finance">Finance Manager</option>
                            <option value="Operations">Operations Manager</option>
                            <option value="KYC Manager">KYC Manager</option>
                            <option value="Support">Support Manager</option>
                            <option value="Read Only">Viewer / Read Only</option>
                        </select>
                    </div>
                </div>

                <div id="login-error" class="text-rose-500 text-center text-xs font-semibold hidden"></div>

                <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                    <button type="button" onclick="requestOTP()" class="hover:text-brand-yellow transition-all-300">
                        <i class="fa-solid fa-key mr-1"></i> Forgot Password / Security Key?
                    </button>
                    <span class="text-brand-gray">|</span>
                    <button type="button" onclick="requestOTP()" class="hover:text-brand-yellow transition-all-300">
                        Request OTP
                    </button>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-brand-dark bg-brand-yellow hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-yellow transition-all-300">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fa-solid fa-lock text-brand-dark/50 group-hover:text-brand-dark/70 transition-all-300"></i>
                        </span>
                        Authenticate & Initialize
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="hidden h-full flex flex-col md:flex-row bg-brand-bg overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-brand-dark text-white flex-shrink-0 flex flex-col h-auto md:h-full border-r border-brand-gray shadow-2xl">
            <!-- Brand Logo -->
            <div class="px-6 py-5 border-b border-brand-gray flex items-center justify-between bg-brand-dark">
                <div class="flex items-center gap-2 text-2xl font-black text-white tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                    <span id="role-badge" class="ml-2 px-2 py-0.5 text-[10px] bg-brand-yellow text-brand-dark rounded font-bold uppercase tracking-widest">Admin</span>
                </div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-white focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>

            <!-- Scrollable Navigation menu -->
            <nav id="nav-menu" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto hidden md:block">
                <!-- Navigation Items will be loaded dynamically based on dynamic user role -->
            </nav>

            <!-- Bottom User Profile Card -->
            <div class="p-4 border-t border-brand-gray bg-brand-dark/90 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-brand-yellow flex items-center justify-center text-brand-dark font-bold">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <div id="user-role-display" class="text-xs font-bold text-white">Super Admin</div>
                        <div class="text-[10px] text-slate-400">Live Session</div>
                    </div>
                </div>
                <button onclick="logout()" class="text-rose-400 hover:text-rose-300 p-2 rounded transition-all-300" title="Log Out">
                    <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENT BODY -->
        <main class="flex-1 flex flex-col overflow-hidden bg-brand-bg">
            <!-- Global Navbar Header -->
            <header class="h-16 bg-brand-dark border-b border-brand-gray flex items-center justify-between px-6 shadow-sm z-10">
                <div class="flex items-center gap-4">
                    <h1 id="page-header-title" class="text-lg font-bold text-white">Enterprise Dashboard</h1>
                    <span id="api-status-indicator" class="flex items-center gap-1.5 text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-semibold border border-emerald-500/20">
                        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Dynamic API Connected
                    </span>
                </div>

                <!-- Global Bilingual Search Bar -->
                <div class="relative hidden sm:block w-72 md:w-96 mx-4">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs"></i>
                    </div>
                    <input type="text" id="global-search-input" onkeyup="handleGlobalSearch(event)" class="w-full pl-9 pr-4 py-2 rounded-lg bg-brand-dark border border-brand-gray/80 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-yellow placeholder-slate-500 transition-all-300" placeholder="Search modules (e.g., Refund, रिफंड)...">
                    <div id="global-search-results" class="absolute left-0 right-0 mt-2 bg-brand-dark border border-brand-gray/80 rounded-xl shadow-2xl hidden max-h-60 overflow-y-auto z-50">
                        <!-- Dynamic search result rows -->
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <!-- Language Picker Toggle -->
                    <div class="flex items-center gap-1 bg-brand-dark/50 border border-brand-gray/60 rounded-lg p-1 mr-2">
                        <button id="lang-btn-en" onclick="setLanguage('en')" class="px-2.5 py-1 text-[11px] font-black bg-brand-yellow text-brand-dark rounded transition-all-300">EN</button>
                        <button id="lang-btn-hi" onclick="setLanguage('hi')" class="px-2.5 py-1 text-[11px] font-semibold text-slate-400 hover:text-white transition-all-300">हिन्दी</button>
                    </div>

                    <!-- Enterprise Notifications Bell -->
                    <div class="relative">
                        <button onclick="toggleInAppNotificationCenter()" class="relative p-2 text-brand-yellow hover:bg-brand-gray/40 rounded-full transition-all-300" title="Enterprise Notifications Center">
                            <i class="fa-solid fa-bell text-xl"></i>
                            <span id="notif-badge" class="absolute -top-1 -right-1 bg-brand-yellow text-brand-dark font-black text-[10px] h-5 w-5 rounded-full flex items-center justify-center hidden">0</span>
                        </button>

                        <!-- Notifications Popup Panel Dropdown -->
                        <div id="inapp-notification-dropdown" class="absolute right-0 mt-3 w-80 bg-brand-dark border border-brand-gray/80 rounded-2xl shadow-2xl hidden flex flex-col z-50 overflow-hidden text-slate-100">
                            <div class="p-4 border-b border-brand-gray/60 flex items-center justify-between bg-brand-dark">
                                <h4 class="text-xs font-black text-white uppercase tracking-wider">In-App Notifications</h4>
                                <button onclick="markAllNotificationsAsRead()" class="text-[9px] font-bold text-brand-yellow hover:underline uppercase">Mark all read</button>
                            </div>
                            <div id="inapp-notification-list" class="max-h-72 overflow-y-auto divide-y divide-brand-gray/40">
                                <!-- Dynamic notifications load here -->
                            </div>
                            <div class="p-3 bg-brand-dark/50 text-center border-t border-brand-gray/40">
                                <button onclick="navigate('notifications'); toggleInAppNotificationCenter();" class="text-[10px] font-bold text-brand-yellow hover:underline uppercase tracking-wider">See All Alerts</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="navigate('sos')" class="relative p-2 text-rose-500 hover:bg-rose-500/10 rounded-full transition-all-300" title="Active SOS Alarms">
                        <i class="fa-solid fa-bell text-xl animate-bounce"></i>
                        <span id="sos-badge" class="absolute -top-1 -right-1 bg-rose-600 text-white font-bold text-[10px] h-5 w-5 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>
            </header>

            <!-- CONTENT SCREENCONTAINER -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-brand-bg text-slate-200" id="content-container">
                <!-- Modules load dynamically into this area -->
            </div>
        </main>
    </div>

    <!-- GLOBAL NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3">
        <div id="toast-icon-wrap" class="w-7 h-7 rounded-full flex items-center justify-center text-xs"></div>
        <div id="toast-text" class="text-sm font-semibold"></div>
    </div>

    <!-- DYNAMIC GLOBAL MODAL TEMPLATE -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-brand-bg/80 p-4 transition-all duration-300 backdrop-blur-sm">
        <div class="bg-brand-card rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[85vh] border border-brand-gray animate-in fade-in zoom-in-95 duration-200 text-slate-100">
            <div class="bg-brand-dark text-white px-6 py-4 flex items-center justify-between border-b border-brand-gray">
                <h3 id="modal-title" class="font-bold text-base text-brand-yellow">Modal Header</h3>
                <button onclick="closeGlobalModal()" class="text-slate-400 hover:text-white transition-all-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 space-y-4 text-sm bg-brand-card">
                <!-- Inner fields added here -->
            </div>
            <div id="modal-footer" class="px-6 py-4 bg-brand-dark border-t border-brand-gray flex justify-end gap-3">
                <!-- Custom buttons loaded dynamically -->
            </div>
        </div>
    </div>

        function t(key) {
            if (LOCALIZATION_DICTIONARY[currentLanguage] && LOCALIZATION_DICTIONARY[currentLanguage][key]) {
                return LOCALIZATION_DICTIONARY[currentLanguage][key];
            }
            return key;
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('prinsgo_admin_lang', lang);
            buildSidebarMenu();

            // Translate header elements
            const headerTitle = document.getElementById('page-header-title');
            if (headerTitle && activePage) {
                headerTitle.textContent = t(activePage);
            }
            // Translate static status indicator
            const apiInd = document.getElementById('api-status-indicator');
            if (apiInd) {
                apiInd.innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> ${t('api_connected')}`;
            }
            // Update global search input placeholder
            const searchInput = document.getElementById('global-search-input');
            if (searchInput) {
                searchInput.placeholder = t('search_placeholder');
            }

            // Update button styles on language pickers
            const btnEn = document.getElementById('lang-btn-en');
            const btnHi = document.getElementById('lang-btn-hi');
            if (btnEn && btnHi) {
                if (lang === 'en') {
                    btnEn.className = "px-2 py-1 text-[11px] font-black bg-brand-yellow text-brand-dark rounded";
                    btnHi.className = "px-2 py-1 text-[11px] font-semibold text-slate-400 hover:text-white";
                } else {
                    btnEn.className = "px-2 py-1 text-[11px] font-semibold text-slate-400 hover:text-white";
                    btnHi.className = "px-2 py-1 text-[11px] font-black bg-brand-yellow text-brand-dark rounded";
                }
            }

            // Refresh menu display
            const sessionLiveLabel = document.getElementById('session-live-label');
            if (sessionLiveLabel) {
                sessionLiveLabel.textContent = t('session_live');
            }
        }

        function handleGlobalSearch(event) {
            const val = event.target.value.trim().toLowerCase();
            const resultsDiv = document.getElementById('global-search-results');
            if (searchTimeout) clearTimeout(searchTimeout);

            if (!val) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(() => {
                const results = [];
                const allowed = ROLE_PERMISSIONS[USER_ROLE] || [];

                // 1. Search Modules
                SIDEBAR_CATEGORIES.forEach(cat => {
                    cat.items.forEach(item => {
                        if (!allowed.includes(item.id)) return;

                        const enText = (LOCALIZATION_DICTIONARY['en'][item.id] || '').toLowerCase();
                        const hiText = (LOCALIZATION_DICTIONARY['hi'][item.id] || '').toLowerCase();

                        if (item.id.toLowerCase().includes(val) || enText.includes(val) || hiText.includes(val)) {
                            results.push({ id: item.id, title: t(item.id), category: t(cat.title + '_CAT'), icon: item.icon });
                        }
                    });
                });

                // 2. Search Settings & Options
                SEARCHABLE_SETTINGS.forEach(setting => {
                    if (!allowed.includes(setting.target)) return;
                    if (setting.keywords.some(k => k.includes(val) || val.includes(k))) {
                        // Avoid duplicates if module already listed
                        if (!results.some(r => r.id === setting.target)) {
                            results.push({ id: setting.target, title: setting.title, category: 'SETTINGS & CONFIG', icon: setting.icon });
                        }
                    }
                });

                if (results.length === 0) {
                    resultsDiv.innerHTML = `<div class="p-4 text-xs text-slate-500 text-center">No modules or settings found matching "${escapeHtml(val)}".</div>`;
                } else {
                    resultsDiv.innerHTML = results.map(r => `

        // Generic API Fetch Helper
        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API_BASE}/api/admin${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-secret': ADMIN_SECRET,
                    ...(options.headers || {}),
                },
            });
            const data = await res.json();
            if (!res.ok || data.success === false) {
                throw new Error(data.message || `Request failed (${res.status})`);
            }
            return data;
        }

        // Initialize Realtime Socket.IO Connection
        function setupSocket() {
            if (socket) socket.disconnect();
            try {
                socket = io(API_BASE, {
                    auth: { token: ADMIN_SECRET },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Realtime Active Sync
                    `;
                });

                socket.on('disconnect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span> REST Mode
                    `;
                });

                // Reconnect & Heartbeat Handlers
                socket.on('connect_error', (err) => {
                    console.warn("WebSocket connection error. Falling back gracefully to REST API mode.", err);
                    const ind = document.getElementById('api-status-indicator');
                    if (ind) ind.innerHTML = `<span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span> REST Fallback Mode`;
                });

                // Global Realtime Platform Notifications Listener
                const realtimeEvents = [
                    'ride_requested', 'ride_accepted', 'driver_assigned', 'driver_arrived', 'ride_started', 'ride_completed', 'ride_cancelled',
                    'parcel_requested', 'parcel_accepted', 'parcel_picked_up', 'parcel_delivered',
                    'payment_success', 'payment_failed', 'refund_initiated', 'refund_completed',
                    'kyc_submitted', 'kyc_approved', 'security_alert'
                ];

                realtimeEvents.forEach(evt => {
                    socket.on(evt, (data) => {
                        const title = data.title || evt.replace('_', ' ').toUpperCase();
                        const message = data.message || `Event ${evt} triggered on live platform.`;

                        showToast(`⚡ Realtime Event: ${title}`, 'success');

                        inAppNotifications.unshift({
                            id: 'n_rt_' + Date.now(),
                            title: title,
                            message: message,
                            type: evt.split('_')[0],
                            priority: data.priority || 'high',
                            read: false,
                            createdAt: new Date()
                        });
                        renderInAppNotifications();

                        // Refresh active page if applicable
                        if (activePage === 'dashboard') loadDashboard();
                        else if (activePage === 'rides' && evt.startsWith('ride')) loadRides(ridePage);
                        else if (activePage === 'parcels' && evt.startsWith('parcel')) loadParcels(parcelPage);
                        else if (activePage === 'payments' && evt.startsWith('payment')) loadPayments();
                        else if (activePage === 'refunds' && evt.startsWith('refund')) loadRefunds();
                    });
                });

                // Global SOS alert trigger
                socket.on('new_sos_alert', (data) => {
                    showToast(`⚠️ SOS EMERGENCY TRIGGERED BY ${data.userType || 'USER'}!`, 'error');
                    updateSOSCount();
                    if (activePage === 'sos') loadSOS();
                });
            } catch (err) {
                console.warn("Realtime WebSocket connection not available. Running in polling fallback.", err);
            }
        }

        // Perform login auth
        function login() {
            const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
            const secret = document.getElementById('admin-secret').value.trim();
            const role = document.getElementById('admin-role').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            if (!url || !secret) {
                errEl.textContent = 'Enter both backend URL and admin secret.';
                errEl.classList.remove('hidden');
                return;
            }

            API_BASE = url;
            ADMIN_SECRET = secret;
            USER_ROLE = role;

            apiFetch('/dashboard')
                .then(() => {
                    localStorage.setItem('prinsgo_admin_url', url);
                    localStorage.setItem('prinsgo_admin_secret', secret);
                    localStorage.setItem('prinsgo_admin_role', role);

                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');

                    document.getElementById('user-role-display').textContent = USER_ROLE;
                    document.getElementById('role-badge').textContent = USER_ROLE;

                    setupSocket();
                    buildSidebarMenu();
                    setLanguage(currentLanguage);
                    navigate('dashboard');
                })
                .catch((err) => {
                    errEl.textContent = err.message.includes('denied') ? 'Incorrect admin security key.' : `Failed: ${err.message}`;
                    errEl.classList.remove('hidden');
                });
        }

            else if (page === 'customer_app_cms') loadCustomerAppCMS();
            else if (page === 'driver_app_cms') loadDriverAppCMS();

        async function submitForceCancel(id, type) {
            const reason = document.getElementById('cancel-reason').value.trim();
            if (!reason) {
                showToast("Please provide a cancellation reason.", "error");
                return;
            }
            try {
                const path = type === 'ride' ? `/rides/${id}/cancel` : `/parcels/${id}/cancel`;
                await apiFetch(path, {
                    method: 'PUT',
                    body: JSON.stringify({ reason })
                });
                showToast(`${type} successfully cancelled.`, 'success');
                closeGlobalModal();
                if (type === 'ride') loadRides(ridePage);
                else loadParcels(parcelPage);
            } catch (err) {
                showToast(`Failed: ${err.message}`, 'error');
            }
        }

        async function submitWalletAdjustment(ownerId, ownerType) {
            const type = document.getElementById('adjust-type').value;
            const amountVal = document.getElementById('adjust-amount').value;
            const reason = document.getElementById('adjust-reason').value.trim();

            const amount = parseFloat(amountVal);
            if (isNaN(amount) || amount <= 0) {
                showToast("Please enter a valid positive adjustment amount.", "error");
                return;
            }
            if (!reason) {
                showToast("Adjustment reason/ledger entry details is required.", "error");
                return;
            }

            try {
                await apiFetch('/wallet/adjust', {
                    method: 'POST',
                    body: JSON.stringify({ ownerId, ownerType, type, amount, reason })
                });
                showToast("Wallet transaction adjusted successfully.", "success");
                closeGlobalModal();
                if (ownerType === 'User') loadCustomers(customerPage);
                else loadDrivers(driverPage);
            } catch (err) {
                showToast(`Failed: ${err.message}`, "error");
            }
        }

                    ALL_MODULES.forEach(mod => {

        async function submitBannerForm() {
            const title = document.getElementById('banner-title').value.trim();
            const imageUrl = document.getElementById('banner-image').value.trim();
            const linkType = document.getElementById('banner-link-type').value;
            const linkValue = document.getElementById('banner-link-value').value.trim();
            const order = parseInt(document.getElementById('banner-priority').value);

            if (!title || !imageUrl || isNaN(order)) {
                showToast("Please fill required fields correctly.", "error");
                return;
            }

            const bannerPayload = {
                title,
                imageUrl,
                image: imageUrl,
                linkType,
                linkValue,
                link: linkValue,
                order,
                priority: order,
                isActive: true
            };

            try {
                // Try direct /banners endpoint first if supported by backend
                try {
                    await apiFetch('/banners', {
                        method: 'POST',
                        body: JSON.stringify(bannerPayload)
                    });
                } catch (e) {
                    console.warn("Direct /banners API POST non-fatal error, syncing via /settings:", e);
                }

                // Sync with /settings store
                const res = await apiFetch('/settings');
                const s = res.settings || {};
                const list = s.banners_list || s.banners || [];
                list.push(bannerPayload);
                s.banners_list = list;
                s.banners = list;

                await apiFetch('/settings', {
                    method: 'PUT',
                    body: JSON.stringify(s)
                });
                showToast("New banner successfully published to both Customer and Driver apps.", "success");
                loadBannersCMS();
            } catch (err) {
                showToast(`Failed: ${err.message}`, "error");
            }
        }

        async function deleteBannerCMS(idx, bannerId = null) {

                    } catch (e) {
                        console.warn(`Direct /banners/${bannerId} DELETE error, syncing via /settings:`, e);
                    }
                }

                const res = await apiFetch('/settings');
                const s = res.settings || {};
                const list = s.banners_list || s.banners || [];
                if (idx >= 0 && idx < list.length) {
                    list.splice(idx, 1);

                s.banners_list = list;
                s.banners = list;

                await apiFetch('/settings', {
                    method: 'PUT',

                });

        async function submitBroadcast() {
            const title = document.getElementById('notif-title').value.trim();
            const message = document.getElementById('notif-message').value.trim();
            const audience = document.getElementById('notif-audience').value;
            const priority = document.getElementById('notif-priority').value;
            const type = document.getElementById('notif-type').value;
            const deeplink = document.getElementById('notif-deeplink').value.trim();
            const imageUrl = document.getElementById('notif-image-url').value.trim();

            if (!title || !message) {
                showToast("Please provide all broadcaster fields correctly.", "error");
                return;
            }

            try {
                await apiFetch('/notifications/broadcast', {
                    method: 'POST',
                    body: JSON.stringify({ title, message, audience, priority, type, deeplink, imageUrl })
                });
                showToast("Targeted push broadcast alert successfully queued.", "success");

                // Add dynamically to local In-App notifications for testing automatic event dispatches
                inAppNotifications.unshift({
                    id: 'n_user_' + Date.now(),
                    title: title,
                    message: message,
                    type: type.toLowerCase(),
                    priority: priority.toLowerCase(),
                    read: false,
                    createdAt: new Date()
                });
                renderInAppNotifications();

                loadNotifications(1);
            } catch (err) {
                console.warn("REST Broadcast queue failed, falling back to local simulation.", err);

                // Add to local list anyway so user is able to see actions take effect immediately
                inAppNotifications.unshift({
                    id: 'n_user_' + Date.now(),
                    title: title,
                    message: message,
                    type: type.toLowerCase(),
                    priority: priority.toLowerCase(),
                    read: false,
                    createdAt: new Date()
                });
                renderInAppNotifications();
                showToast("Push broadcast alert successfully dispatched & simulated.", "success");
                loadNotifications(1);
            }
        }

        function handleFileChange(event, elementId) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate Size (< 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showToast("File size limit exceeded. Max allowed is 5MB.", "error");
                return;
            }

            // Validate MIME type
            const allowed = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'application/pdf'];
            if (!allowed.includes(file.type)) {
                showToast("Unsupported format. Please select PNG, JPG, WEBP, or PDF.", "error");
                return;
            }

            // Hide drag content, show progress bar
            document.getElementById(`drag-zone-${elementId}`).classList.add('hidden');
            const prog = document.getElementById(`progress-container-${elementId}`);
            prog.classList.remove('hidden');

            let percent = 0;
            const interval = setInterval(() => {
                percent += 20;
                document.getElementById(`progress-bar-${elementId}`).style.width = percent + '%';
                document.getElementById(`progress-percent-${elementId}`).textContent = percent + '%';

                if (percent >= 100) {
                    clearInterval(interval);
                    prog.classList.add('hidden');

                    // Show Preview
                    const preview = document.getElementById(`preview-container-${elementId}`);
                    preview.classList.remove('hidden');
                    document.getElementById(`preview-name-${elementId}`).textContent = file.name;
                    document.getElementById(`preview-size-${elementId}`).textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

                    // Update Thumbnail
                    const thumb = document.getElementById(`preview-thumb-${elementId}`);
                    if (file.type.startsWith('image/')) {
                        thumb.innerHTML = `<img src="${URL.createObjectURL(file)}" class="w-full h-full object-cover rounded-lg">`;
                    } else {
                        thumb.innerHTML = `<i class="fa-solid fa-file-pdf text-rose-500 text-lg"></i>`;
                    }

                    showToast("Document successfully validated & uploaded.", "success");
                }
            }, 100);
        }

        function clearUploadedFile(elementId) {
            document.getElementById(`preview-container-${elementId}`).classList.add('hidden');
            document.getElementById(`drag-zone-${elementId}`).classList.remove('hidden');
            document.getElementById(`file-input-${elementId}`).value = '';
            showToast("Document link removed.", "success");

        // SheetJS Excel Exporter
        function exportToExcel() {
            const table = document.getElementById('reports-export-table');
            if (!table) {
                showToast("No data available to export.", "error");
                return;
            }
            const wb = XLSX.utils.table_to_book(table, { sheet: "Financial Ledger" });
            XLSX.writeFile(wb, "PrinsGo_Financial_Ledger_Report.xlsx");
            showToast("Financial Ledger Report successfully exported to Excel.", "success");
        }

        // jsPDF Exporter
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PrinsGo - Enterprise Financial Report", 14, 20);

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text(`Issuer Role: ${USER_ROLE}`, 14, 34);

            doc.line(14, 38, 196, 38);

            const rows = [];
            const headers = ["Date", "Owner ID", "Type", "Amount", "Reason"];
            document.querySelectorAll("#reports-export-table tbody tr").forEach(tr => {
                const cells = tr.querySelectorAll("td");
                if (cells.length >= 5) {
                    rows.push([
                        cells[0].innerText,
                        cells[1].innerText.slice(-8),
                        cells[2].innerText,
                        cells[3].innerText,
                        cells[4].innerText
                    ]);
                }
            });

            let y = 46;
            doc.setFont("Helvetica", "bold");
            doc.text(headers[0], 14, y);
            doc.text(headers[1], 45, y);
            doc.text(headers[2], 85, y);
            doc.text(headers[3], 120, y);
            doc.text(headers[4], 145, y);
            y += 8;

            doc.setFont("Helvetica", "normal");
            rows.forEach(r => {
                if (y > 280) { doc.addPage(); y = 20; }
                doc.text(r[0], 14, y);
                doc.text(r[1], 45, y);
                doc.text(r[2], 85, y);
                doc.text(r[3], 120, y);
                doc.text(r[4], 145, y);
                y += 8;
            });

            doc.save("PrinsGo_Financial_Ledger_Report.pdf");
            showToast("Financial Ledger Report successfully exported to PDF.", "success");
        }

        async function publishCustomerCMS() {
            try {
                // Get settings first
                const sRes = await apiFetch('/settings');
                const s = sRes.settings || {};

                s.customer_app_cms = currentCustomerCMS;

                // Also sync banner_slider widget edit to live banner endpoints
                const bannerWidget = currentCustomerCMS.find(i => i.id === 'banner_slider');
                if (bannerWidget) {
                    const bannerTitle = bannerWidget.title;
                    let linkVal = bannerWidget.subtitle || '';
                    if (linkVal.includes('Use Promo Code ')) {
                        linkVal = linkVal.replace('Use Promo Code ', '').trim();
                    }

                    // Fetch current live banners to see if there is an existing banner ID
                    const bannersRes = await fetch(`${API_BASE}/api/banners`).then(r => r.json()).catch(() => ({ success: false, banners: [] }));
                    const liveBanners = (bannersRes && bannersRes.success && bannersRes.banners) ? bannersRes.banners : [];

                    const bannerPayload = {
                        title: bannerTitle,
                        imageUrl: (liveBanners.length > 0 && liveBanners[0].imageUrl) ? liveBanners[0].imageUrl : 'https://prinsgo.com/welcome_banner.png',
                        image: (liveBanners.length > 0 && liveBanners[0].imageUrl) ? liveBanners[0].imageUrl : 'https://prinsgo.com/welcome_banner.png',
                        linkType: (liveBanners.length > 0 && liveBanners[0].linkType) ? liveBanners[0].linkType : 'none',
                        linkValue: linkVal,
                        link: linkVal,
                        order: 0,
                        priority: 0,
                        isActive: true
                    };

                    if (liveBanners.length > 0 && liveBanners[0]._id) {
                        const bannerId = liveBanners[0]._id;
                        try {
                            await apiFetch(`/banners/${bannerId}`, {
                                method: 'PUT',
                                body: JSON.stringify(bannerPayload)
                            });
                        } catch (e) {
                            console.warn(`Direct /banners/${bannerId} PUT error, syncing via /settings:`, e);
                        }
                    } else {
                        try {
                            await apiFetch('/banners', {
                                method: 'POST',
                                body: JSON.stringify(bannerPayload)
                            });
                        } catch (e) {
                            console.warn("Direct /banners POST error, syncing via /settings:", e);
                        }
                    }

                    // Sync with s.banners_list and s.banners in settings
                    const list = s.banners_list || s.banners || [];
                    if (list.length > 0) {
                        list[0].title = bannerTitle;
                        list[0].linkValue = linkVal;
                        list[0].link = linkVal;
                    } else {
                        list.push(bannerPayload);
                    }
                    s.banners_list = list;
                    s.banners = list;
                }

                await apiFetch('/settings', {
                    method: 'PUT',
                    body: JSON.stringify(s)
                });
                showToast("Customer App Home CMS Layout published successfully to Live App.", "success");
            } catch (err) {
                showToast(`Failed: ${err.message}`, "error");
            }
        }

            const url = localStorage.getItem('prinsgo_admin_url');
            const secret = localStorage.getItem('prinsgo_admin_secret');
            const role = localStorage.getItem('prinsgo_admin_role');

            if (url && secret && role) {

                document.getElementById('admin-role').value = role;

                        document.getElementById('app').classList.remove('hidden');
                        document.getElementById('user-role-display').textContent = USER_ROLE;
                        document.getElementById('role-badge').textContent = USER_ROLE;

                        setupSocket();
                        buildSidebarMenu();
                        setLanguage(currentLanguage);
                        navigate('dashboard');
                    })
                    .catch(() => {
                        localStorage.removeItem('prinsgo_admin_url');
                        localStorage.removeItem('prinsgo_admin_secret');
                        localStorage.removeItem('prinsgo_admin_role');
                    });
            } else {
                document.getElementById('backend-url').value = 'https://prinsgo-backend.onrender.com';
            }
        })();

        // Helper: safe HTML escaping
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        // Default value handling helper
        function safeValue(val, fallback = '0') {
            if (val === undefined || val === null || isNaN(val)) return fallback;
            return val;
        }

        // Initialize dynamic stats
        setInterval(updateSOSCount, 15000);
    </script>
</body>
</html>
