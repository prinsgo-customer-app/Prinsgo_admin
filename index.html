<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrinsGo - Enterprise Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            yellow: '#FFC72C',
                            dark: '#0F0F14',
                            gray: '#1A1B22',
                            bg: '#0B0B0F',
                            card: '#16161F'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- jsPDF & SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0B0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFC72C40;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FFC72C70;
        }
        /* Custom Premium Micro-animations */
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="h-full text-slate-100 antialiased font-sans bg-brand-bg selection:bg-brand-yellow/30">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-height-screen flex items-center justify-center bg-brand-bg px-4 py-12 sm:px-6 lg:px-8 h-full">
        <div class="max-w-md w-full space-y-8 bg-brand-card p-10 rounded-2xl shadow-2xl border border-brand-gray transition-all-300 hover:scale-[1.01]">
            <div>
                <div class="flex justify-center items-center gap-2 text-3xl font-black text-white tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                </div>
                <h2 class="mt-4 text-center text-xl font-bold text-white">
                    Enterprise Portal Login
                </h2>
                <p class="mt-2 text-center text-xs text-slate-400">
                    Please provide your environment URL & credentials
                </p>
            </div>
            <form class="mt-8 space-y-6" onsubmit="event.preventDefault(); login();">
                <div class="rounded-md space-y-4">
                    <div>
                        <label for="backend-url" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Backend Base API URL</label>
                        <input id="backend-url" name="backend-url" type="url" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray placeholder-slate-500 text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark" placeholder="https://prinsgo-backend.onrender.com">
                    </div>
                    <div>
                        <label for="admin-secret" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Admin Security Key / Secret</label>
                        <input id="admin-secret" name="admin-secret" type="password" required class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray placeholder-slate-500 text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark" placeholder="••••••••••••">
                    </div>
                    <div>
                        <label for="admin-role" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Assigned Role</label>
                        <select id="admin-role" class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-brand-gray text-white focus:outline-none focus:ring-2 focus:ring-brand-yellow focus:border-transparent text-sm bg-brand-dark">
                            <option value="Super Admin">Super Admin</option>
                            <option value="Admin">Admin</option>
                            <option value="Finance">Finance Manager</option>
                            <option value="Operations">Operations Manager</option>
                            <option value="KYC Manager">KYC Manager</option>
                            <option value="Support">Support Manager</option>
                            <option value="Read Only">Viewer / Read Only</option>
                        </select>
                    </div>
                </div>

                <div id="login-error" class="text-rose-500 text-center text-xs font-semibold hidden"></div>

                <div class="flex items-center justify-between text-xs font-semibold text-slate-400">
                    <button type="button" onclick="requestOTP()" class="hover:text-brand-yellow transition-all-300">
                        <i class="fa-solid fa-key mr-1"></i> Forgot Password / Security Key?
                    </button>
                    <span class="text-brand-gray">|</span>
                    <button type="button" onclick="requestOTP()" class="hover:text-brand-yellow transition-all-300">
                        Request OTP
                    </button>
                </div>

                <div>
                    <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-brand-dark bg-brand-yellow hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-yellow transition-all-300">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fa-solid fa-lock text-brand-dark/50 group-hover:text-brand-dark/70 transition-all-300"></i>
                        </span>
                        Authenticate & Initialize
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="hidden h-full flex flex-col md:flex-row bg-brand-bg overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-brand-dark text-white flex-shrink-0 flex flex-col h-auto md:h-full border-r border-brand-gray shadow-2xl">
            <!-- Brand Logo -->
            <div class="px-6 py-5 border-b border-brand-gray flex items-center justify-between bg-brand-dark">
                <div class="flex items-center gap-2 text-2xl font-black text-white tracking-tight">
                    Prins<span class="text-brand-yellow">Go</span>
                    <span id="role-badge" class="ml-2 px-2 py-0.5 text-[10px] bg-brand-yellow text-brand-dark rounded font-bold uppercase tracking-widest">Admin</span>
                </div>
                <button onclick="toggleMobileMenu()" class="md:hidden text-white focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>

            <!-- Scrollable Navigation menu -->
            <nav id="nav-menu" class="flex-1 px-3 py-4 space-y-1 overflow-y-auto hidden md:block">
                <!-- Navigation Items will be loaded dynamically based on dynamic user role -->
            </nav>

            <!-- Bottom User Profile Card -->
            <div class="p-4 border-t border-brand-gray bg-brand-dark/90 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-brand-yellow flex items-center justify-center text-brand-dark font-bold">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <div id="user-role-display" class="text-xs font-bold text-white">Super Admin</div>
                        <div class="text-[10px] text-slate-400">Live Session</div>
                    </div>
                </div>
                <button onclick="logout()" class="text-rose-400 hover:text-rose-300 p-2 rounded transition-all-300" title="Log Out">
                    <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                </button>
            </div>
        </aside>

        <!-- CONTENT BODY -->
        <main class="flex-1 flex flex-col overflow-hidden bg-brand-bg">
            <!-- Global Navbar Header -->
            <header class="h-16 bg-brand-dark border-b border-brand-gray flex items-center justify-between px-6 shadow-sm z-10">
                <div class="flex items-center gap-4">
                    <h1 id="page-header-title" class="text-lg font-bold text-white">Enterprise Dashboard</h1>
                    <span id="api-status-indicator" class="flex items-center gap-1.5 text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-semibold border border-emerald-500/20">
                        <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> Dynamic API Connected
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="navigate('sos')" class="relative p-2 text-rose-500 hover:bg-rose-500/10 rounded-full transition-all-300" title="Active SOS Alarms">
                        <i class="fa-solid fa-bell text-xl animate-bounce"></i>
                        <span id="sos-badge" class="absolute -top-1 -right-1 bg-rose-600 text-white font-bold text-[10px] h-5 w-5 rounded-full flex items-center justify-center">0</span>
                    </button>
                </div>
            </header>

            <!-- CONTENT SCREENCONTAINER -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-brand-bg text-slate-200" id="content-container">
                <!-- Modules load dynamically into this area -->
            </div>
        </main>
    </div>

    <!-- GLOBAL NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3">
        <div id="toast-icon-wrap" class="w-7 h-7 rounded-full flex items-center justify-center text-xs"></div>
        <div id="toast-text" class="text-sm font-semibold"></div>
    </div>

    <!-- DYNAMIC GLOBAL MODAL TEMPLATE -->
    <div id="global-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-brand-bg/80 p-4 transition-all duration-300 backdrop-blur-sm">
        <div class="bg-brand-card rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col max-h-[85vh] border border-brand-gray animate-in fade-in zoom-in-95 duration-200 text-slate-100">
            <div class="bg-brand-dark text-white px-6 py-4 flex items-center justify-between border-b border-brand-gray">
                <h3 id="modal-title" class="font-bold text-base text-brand-yellow">Modal Header</h3>
                <button onclick="closeGlobalModal()" class="text-slate-400 hover:text-white transition-all-300">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 space-y-4 text-sm bg-brand-card">
                <!-- Inner fields added here -->
            </div>
            <div id="modal-footer" class="px-6 py-4 bg-brand-dark border-t border-brand-gray flex justify-end gap-3">
                <!-- Custom buttons loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- CORE SCRIPTS & CONTROLLER LOGIC -->
    <script>
        let API_BASE = '';
        let ADMIN_SECRET = '';
        let USER_ROLE = 'Super Admin';
        let socket = null;
        let activePage = 'dashboard';
        let refreshInterval = null;

        // Dynamic Role Based Access Module Lists
        const SIDEBAR_CATEGORIES = [
            {
                title: "DASHBOARD",
                icon: "fa-chart-pie",
                items: [
                    { id: 'dashboard', title: 'Overview', icon: 'fa-gauge-high' }
                ]
            },
            {
                title: "APPLICATION CMS",
                icon: "fa-mobile-screen-button",
                items: [
                    { id: 'customer_app_cms', title: 'Customer App CMS', icon: 'fa-user-gear' },
                    { id: 'driver_app_cms', title: 'Driver App CMS', icon: 'fa-user-ninja' }
                ]
            },
            {
                title: "OPERATIONS",
                icon: "fa-road",
                items: [
                    { id: 'rides', title: 'Ride Management', icon: 'fa-taxi' },
                    { id: 'parcels', title: 'Parcel Management', icon: 'fa-box-open' },
                    { id: 'drivers', title: 'Driver Directory', icon: 'fa-id-card' },
                    { id: 'customers', title: 'Customer Profile Center', icon: 'fa-users' },
                    { id: 'kyc', title: 'KYC & Documents', icon: 'fa-user-check' },
                    { id: 'sos', title: 'SOS & Emergency', icon: 'fa-circle-exclamation' }
                ]
            },
            {
                title: "FINANCE",
                icon: "fa-hand-holding-dollar",
                items: [
                    { id: 'wallet', title: 'Wallet & Ledger', icon: 'fa-wallet' },
                    { id: 'payments', title: 'Payments & Transactions', icon: 'fa-credit-card' },
                    { id: 'refunds', title: 'Refunds & Claims', icon: 'fa-arrow-rotate-left' },
                    { id: 'payouts', title: 'Earnings & Payouts', icon: 'fa-money-bill-transfer' },
                    { id: 'pricing', title: 'Pricing & Charges', icon: 'fa-calculator' },
                    { id: 'reports', title: 'GST & Financial Reports', icon: 'fa-file-invoice-dollar' }
                ]
            },
            {
                title: "MARKETING",
                icon: "fa-bullhorn",
                items: [
                    { id: 'coupons', title: 'Offers & Coupons', icon: 'fa-tag' },
                    { id: 'referrals', title: 'Referral & Rewards', icon: 'fa-gift' },
                    { id: 'banners', title: 'Banners CMS', icon: 'fa-image' },
                    { id: 'explore_cities', title: 'Explore Cities', icon: 'fa-city' },
                    { id: 'notifications', title: 'Notifications & Alerts', icon: 'fa-bell' },
                    { id: 'social_media', title: 'Social Media CMS', icon: 'fa-share-nodes' }
                ]
            },
            {
                title: "CONTENT",
                icon: "fa-file-lines",
                items: [
                    { id: 'content_cms', title: 'Content Management', icon: 'fa-pen-to-square' },
                    { id: 'faq', title: 'FAQ CMS', icon: 'fa-circle-question' },
                    { id: 'about_us', title: 'About Us', icon: 'fa-circle-info' },
                    { id: 'privacy_policy', title: 'Privacy Policy', icon: 'fa-shield-halved' },
                    { id: 'terms_conditions', title: 'Terms & Conditions', icon: 'fa-gavel' },
                    { id: 'safety_security', title: 'Safety & Security', icon: 'fa-user-shield' },
                    { id: 'cancellation_policy', title: 'Cancellation Policy', icon: 'fa-ban' },
                    { id: 'refund_policy', title: 'Refund Policy', icon: 'fa-rotate-left' },
                    { id: 'claims_content', title: 'Claims Policy', icon: 'fa-handshake-angle' },
                    { id: 'legal_pages', title: 'Legal Pages', icon: 'fa-scale-balanced' }
                ]
            },
            {
                title: "CONTROL",
                icon: "fa-sliders",
                items: [
                    { id: 'feature_control', title: 'Feature Control', icon: 'fa-toggle-on' },
                    { id: 'app_settings_cms', title: 'App Settings CMS', icon: 'fa-sliders' },
                    { id: 'company_settings', title: 'Company Settings', icon: 'fa-building' },
                    { id: 'roles_users', title: 'Roles & Users', icon: 'fa-users-cog' },
                    { id: 'roles_permissions', title: 'Roles & Permissions', icon: 'fa-user-lock' },
                    { id: 'id_generation', title: 'ID Generation', icon: 'fa-fingerprint' },
                    { id: 'localization', title: 'Localization', icon: 'fa-language' },
                    { id: 'theme_appearance', title: 'Theme & Appearance', icon: 'fa-palette' }
                ]
            },
            {
                title: "TECHNICAL",
                icon: "fa-laptop-code",
                items: [
                    { id: 'api_integrations', title: 'API & Integrations', icon: 'fa-circle-nodes' },
                    { id: 'system_health', title: 'System Health', icon: 'fa-heart-pulse' },
                    { id: 'activity_logs', title: 'Activity Logs', icon: 'fa-clock-rotate-left' },
                    { id: 'security_audit', title: 'Security Audit Logs', icon: 'fa-shield-halved' },
                    { id: 'support_help', title: 'Support & Help', icon: 'fa-headset' },
                    { id: 'maintenance_mode', title: 'Maintenance Mode', icon: 'fa-screwdriver-wrench' }
                ]
            }
        ];

        const ALL_MODULES = [];
        const MODULE_DETAILS = {};
        SIDEBAR_CATEGORIES.forEach(cat => {
            cat.items.forEach(item => {
                ALL_MODULES.push(item.id);
                MODULE_DETAILS[item.id] = { title: item.title, icon: item.icon };
            });
        });

        const ROLE_PERMISSIONS = {
            'Super Admin': ALL_MODULES,
            'Admin': ALL_MODULES.filter(m => !['security_audit', 'roles_permissions'].includes(m)),
            'Finance': ['dashboard', 'wallet', 'payments', 'refunds', 'payouts', 'pricing', 'reports', 'system_health'],
            'Operations': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'sos', 'system_health', 'support_help'],
            'KYC Manager': ['dashboard', 'kyc', 'drivers', 'system_health'],
            'Support': ['dashboard', 'customers', 'sos', 'notifications', 'support_help'],
            'Read Only': ['dashboard', 'rides', 'parcels', 'drivers', 'customers', 'reports', 'faq', 'about_us', 'privacy_policy', 'terms_conditions']
        };

        // Utility: Show Premium Toast Notification
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            const iconWrap = document.getElementById('toast-icon-wrap');
            const textEl = document.getElementById('toast-text');

            textEl.textContent = msg;
            if (type === 'success') {
                iconWrap.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs bg-emerald-500 text-white';
                iconWrap.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else {
                iconWrap.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs bg-rose-500 text-white';
                iconWrap.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            t.className = "fixed bottom-6 right-6 z-50 transform translate-y-0 opacity-100 transition-all duration-300 bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3";
            setTimeout(() => {
                t.className = "fixed bottom-6 right-6 z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none bg-brand-dark text-white px-5 py-3 rounded-xl shadow-2xl border border-brand-gray flex items-center gap-3";
            }, 3000);
        }

        // Generic API Fetch Helper
        async function apiFetch(path, options = {}) {
            const res = await fetch(`${API_BASE}/api/admin${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-secret': ADMIN_SECRET,
                    ...(options.headers || {}),
                },
            });
            const data = await res.json();
            if (!res.ok || data.success === false) {
                throw new Error(data.message || `Request failed (${res.status})`);
            }
            return data;
        }

        // Initialize Realtime Socket.IO Connection
        function setupSocket() {
            if (socket) socket.disconnect();
            try {
                socket = io(API_BASE, {
                    auth: { token: ADMIN_SECRET },
                    transports: ['websocket', 'polling']
                });

                socket.on('connect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Realtime Active Sync
                    `;
                });

                socket.on('disconnect', () => {
                    document.getElementById('api-status-indicator').innerHTML = `
                        <span class="h-2 w-2 rounded-full bg-amber-500 animate-pulse"></span> REST Mode
                    `;
                });

                // Global SOS alert trigger
                socket.on('new_sos_alert', (data) => {
                    showToast(`⚠️ SOS EMERGENCY TRIGGERED BY ${data.userType}!`, 'error');
                    updateSOSCount();
                    if (activePage === 'sos') loadSOS();
                });
            } catch (err) {
                console.warn("Realtime WebSocket connection not available. Running in polling fallback.", err);
            }
        }

        // Perform login auth
        function login() {
            const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
            const secret = document.getElementById('admin-secret').value.trim();
            const role = document.getElementById('admin-role').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            if (!url || !secret) {
                errEl.textContent = 'Enter both backend URL and admin secret.';
                errEl.classList.remove('hidden');
                return;
            }

            API_BASE = url;
            ADMIN_SECRET = secret;
            USER_ROLE = role;

            apiFetch('/dashboard')
                .then(() => {
                    localStorage.setItem('prinsgo_admin_url', url);
                    localStorage.setItem('prinsgo_admin_secret', secret);
                    localStorage.setItem('prinsgo_admin_role', role);

                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');

                    document.getElementById('user-role-display').textContent = USER_ROLE;
                    document.getElementById('role-badge').textContent = USER_ROLE;

                    setupSocket();
                    buildSidebarMenu();
                    navigate('dashboard');
                })
                .catch((err) => {
                    errEl.textContent = err.message.includes('denied') ? 'Incorrect admin security key.' : `Failed: ${err.message}`;
                    errEl.classList.remove('hidden');
                });
        }

        function logout() {
            localStorage.removeItem('prinsgo_admin_url');
            localStorage.removeItem('prinsgo_admin_secret');
            localStorage.removeItem('prinsgo_admin_role');
            location.reload();
        }

        // Sidebar Category Collapsible Toggle Helper
        function toggleSidebarCategory(catId) {
            const el = document.getElementById(`cat-content-${catId}`);
            const arrow = document.getElementById(`cat-arrow-${catId}`);
            if (el && arrow) {
                el.classList.toggle('hidden');
                arrow.classList.toggle('-rotate-90');
            }
        }

        // Dynamic Navigation Generator based on dynamic role permissions
        function buildSidebarMenu() {
            const menu = document.getElementById('nav-menu');
            const allowed = ROLE_PERMISSIONS[USER_ROLE] || [];

            let html = '';
            SIDEBAR_CATEGORIES.forEach((cat, idx) => {
                const catId = `cat-${idx}`;
                // Filter items that are allowed for the user's role
                const catItems = cat.items.filter(item => allowed.includes(item.id));
                if (catItems.length > 0) {
                    html += `
                        <div class="mb-3">
                            <button onclick="toggleSidebarCategory('${catId}')" class="w-full flex items-center justify-between px-3 py-1.5 text-[10px] font-black uppercase tracking-wider text-slate-400 hover:text-white transition-all-300">
                                <span class="flex items-center gap-2">
                                    <i class="fa-solid ${cat.icon} text-[11px] text-brand-yellow/70"></i>
                                    ${cat.title}
                                </span>
                                <i id="cat-arrow-${catId}" class="fa-solid fa-chevron-down text-[9px] transition-transform duration-300"></i>
                            </button>
                            <div id="cat-content-${catId}" class="mt-1 space-y-1 pl-1">
                                ${catItems.map(item => `
                                    <button onclick="navigate('${item.id}')" id="nav-item-${item.id}" class="nav-item-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-brand-gray/40 font-semibold text-xs transition-all-300">
                                        <i class="fa-solid ${item.icon} text-xs text-brand-yellow/80"></i>
                                        <span>${item.title}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            });
            menu.innerHTML = html;
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('nav-menu');
            menu.classList.toggle('hidden');
        }

        // Navigate page helper
        function navigate(page) {
            // Confirm permissions
            const allowed = ROLE_PERMISSIONS[USER_ROLE] || [];
            if (!allowed.includes(page)) {
                showToast("Access Denied: Your assigned role lacks permissions for this module.", "error");
                return;
            }

            if (refreshInterval) clearInterval(refreshInterval);

            activePage = page;
            document.getElementById('page-header-title').textContent = MODULE_DETAILS[page].title;

            // Update sidebar button styling
            document.querySelectorAll('.nav-item-btn').forEach(btn => {
                btn.className = "nav-item-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-brand-gray/40 font-semibold text-xs transition-all-300";
            });
            const activeBtn = document.getElementById(`nav-item-${page}`);
            if (activeBtn) {

        async function submitForceCancel(id, type) {
            const reason = document.getElementById('cancel-reason').value.trim();
            if (!reason) {
                showToast("Please provide a cancellation reason.", "error");
                return;
            }
            try {
                const path = type === 'ride' ? `/rides/${id}/cancel` : `/parcels/${id}/cancel`;
                await apiFetch(path, {
                    method: 'PUT',
                    body: JSON.stringify({ reason })
                });
                showToast(`${type} successfully cancelled.`, 'success');
                closeGlobalModal();
                if (type === 'ride') loadRides(ridePage);
                else loadParcels(parcelPage);
            } catch (err) {
                showToast(`Failed: ${err.message}`, 'error');
            }
        }

                const path = type === 'ride' ? `/rides/${id}/assign` : `/parcels/${id}/assign`;

            `);

        async function submitWalletAdjustment(ownerId, ownerType) {
            const type = document.getElementById('adjust-type').value;
            const amountVal = document.getElementById('adjust-amount').value;
            const reason = document.getElementById('adjust-reason').value.trim();

            const amount = parseFloat(amountVal);
            if (isNaN(amount) || amount <= 0) {
                showToast("Please enter a valid positive adjustment amount.", "error");
                return;
            }
            if (!reason) {
                showToast("Adjustment reason/ledger entry details is required.", "error");
                return;
            }

            try {
                await apiFetch('/wallet/adjust', {
                    method: 'POST',
                    body: JSON.stringify({ ownerId, ownerType, type, amount, reason })
                });
                showToast("Wallet transaction adjusted successfully.", "success");
                closeGlobalModal();
                if (ownerType === 'User') loadCustomers(customerPage);
                else loadDrivers(driverPage);
            } catch (err) {
                showToast(`Failed: ${err.message}`, "error");
            }
        }

        // SheetJS Excel Exporter
        function exportToExcel() {
            const table = document.getElementById('reports-export-table');
            if (!table) {
                showToast("No data available to export.", "error");
                return;
            }
            const wb = XLSX.utils.table_to_book(table, { sheet: "Financial Ledger" });
            XLSX.writeFile(wb, "PrinsGo_Financial_Ledger_Report.xlsx");
            showToast("Financial Ledger Report successfully exported to Excel.", "success");
        }

        // jsPDF Exporter
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("Helvetica", "bold");
            doc.setFontSize(18);
            doc.text("PrinsGo - Enterprise Financial Report", 14, 20);

            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Generated on: ${new Date().toLocaleString()}`, 14, 28);
            doc.text(`Issuer Role: ${USER_ROLE}`, 14, 34);

            doc.line(14, 38, 196, 38);

            const rows = [];
            const headers = ["Date", "Owner ID", "Type", "Amount", "Reason"];
            document.querySelectorAll("#reports-export-table tbody tr").forEach(tr => {
                const cells = tr.querySelectorAll("td");
                if (cells.length >= 5) {
                    rows.push([
                        cells[0].innerText,
                        cells[1].innerText.slice(-8),
                        cells[2].innerText,
                        cells[3].innerText,
                        cells[4].innerText
                    ]);
                }
            });

            let y = 46;
            doc.setFont("Helvetica", "bold");
            doc.text(headers[0], 14, y);
            doc.text(headers[1], 45, y);
            doc.text(headers[2], 85, y);
            doc.text(headers[3], 120, y);
            doc.text(headers[4], 145, y);
            y += 8;

            doc.setFont("Helvetica", "normal");
            rows.forEach(r => {
                if (y > 280) { doc.addPage(); y = 20; }
                doc.text(r[0], 14, y);
                doc.text(r[1], 45, y);
                doc.text(r[2], 85, y);
                doc.text(r[3], 120, y);
                doc.text(r[4], 145, y);
                y += 8;
            });

            doc.save("PrinsGo_Financial_Ledger_Report.pdf");
            showToast("Financial Ledger Report successfully exported to PDF.", "success");
        }

        (function boot() {
            const url = localStorage.getItem('prinsgo_admin_url');
            const secret = localStorage.getItem('prinsgo_admin_secret');
            const role = localStorage.getItem('prinsgo_admin_role');

            if (url && secret && role) {
                document.getElementById('backend-url').value = url;
                document.getElementById('admin-secret').value = secret;
                document.getElementById('admin-role').value = role;

                API_BASE = url;
                ADMIN_SECRET = secret;
                USER_ROLE = role;

                apiFetch('/dashboard')
                    .then(() => {
                        document.getElementById('login-screen').classList.add('hidden');
                        document.getElementById('app').classList.remove('hidden');
                        document.getElementById('user-role-display').textContent = USER_ROLE;
                        document.getElementById('role-badge').textContent = USER_ROLE;

                        setupSocket();
                        buildSidebarMenu();
                        navigate('dashboard');
                    })
                    .catch(() => {
                        localStorage.removeItem('prinsgo_admin_url');
                        localStorage.removeItem('prinsgo_admin_secret');
                        localStorage.removeItem('prinsgo_admin_role');
                    });
            } else {
                document.getElementById('backend-url').value = 'https://prinsgo-backend.onrender.com';
            }
        })();

        // Helper: safe HTML escaping
        function escapeHtml(str) {
            if (str === undefined || str === null) return '';
            return String(str).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        // Default value handling helper
        function safeValue(val, fallback = '0') {
            if (val === undefined || val === null || isNaN(val)) return fallback;
            return val;
        }

        // Initialize dynamic stats
        setInterval(updateSOSCount, 15000);
    </script>
</body>
